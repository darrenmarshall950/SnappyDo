# SnappyDo — local dev + prod orchestration
#
# Usage:
#   Local dev:    docker compose up
#   Build only:   docker compose build
#   Logs:         docker compose logs -f
#   Prod-like:    docker compose --profile prod up -d
#
# Image is the same in all profiles — only env + bindings differ.

services:
  snappydo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-}
        PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY:-}
    image: snappydo:latest
    container_name: snappydo-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # Public env (browser-visible)
      - PUBLIC_SUPABASE_URL=${PUBLIC_SUPABASE_URL:-}
      - PUBLIC_SUPABASE_ANON_KEY=${PUBLIC_SUPABASE_ANON_KEY:-}
      # Server secrets
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - IMGPROXY_URL=${IMGPROXY_URL:-http://imgproxy:8080}
      - IMGPROXY_PUBLIC_URL=${IMGPROXY_PUBLIC_URL:-http://192.168.0.2:8080}
      - IMGPROXY_KEY=${IMGPROXY_KEY:-}
      - IMGPROXY_SALT=${IMGPROXY_SALT:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-snappydo-uploads}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-prod}
      - UPLOAD_DIR=/app/uploads
      - DB_PATH=/app/data/snappydo.db
    volumes:
      - snappydo_uploads:/app/uploads
      - snappydo_data:/app/data
    depends_on:
      imgproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # imgproxy — on-demand image transformation.
  # Shares the uploads volume with snappydo so it can read uploaded files.
  # In production, switch source to S3 (Cloudflare R2) and remove the bind mount.
  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: snappydo-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_LOCAL_FILESYSTEM_ENABLED: "true"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: "/uploads"
      IMGPROXY_BIND: ":8080"
      IMGPROXY_FORMAT: "jpg,jpeg,png,webp,avif,heic"
      IMGPROXY_MAX_SRC_DIMENSION: "8192"
      IMGPROXY_PROCESSORS: "1"
    volumes:
      - snappydo_uploads:/uploads:ro
    ports:
      - "${IMGPROXY_PORT:-8080}:8080"

  # Optional local Postgres (for fully self-hosted mode, off by default)
  postgres:
    image: postgres:16-alpine
    container_name: snappydo-postgres
    profiles: ["self-host", "dev"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snappydo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snappydo}
      POSTGRES_DB: ${POSTGRES_DB:-snappydo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

volumes:
  snappydo_uploads:
  snappydo_data:
  postgres_data:
